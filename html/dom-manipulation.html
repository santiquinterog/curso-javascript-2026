<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejemplos DOM</title>
    <link rel="stylesheet" href="../css/dom-manipulation.css">
</head>

<body>

    <h1 id="titulo">Título original</h1>

    <div class="contenedor">
        <p>Este es un párrafo dentro del contenedor.</p>
    </div>

    <div class="caja">
        Caja para probar manipulación de clases
    </div>

    <p class="item">Elemento con clase item 1</p>
    <p class="item">Elemento con clase item 2</p>

    <a href="https://google.com.co">Ir a un enlace</a>

    <h2>Lista de elementos</h2>

    <ul id="lista">
        <li>Elemento 1</li>
        <li class="eliminar">Elemento 2 (se puede eliminar)</li>
        <li>Elemento 3</li>
    </ul>

    <h2>Eventos</h2>

    <!-- Evento input -->
    <input type="text" id="inputNombre" placeholder="Escribe tu nombre" />

    <p id="textoNombre"></p>

    <!-- Evento mouseover -->
    <div id="boxHover" style="width:200px; height:100px; background:#ccc; margin-top:10px;">
        Pasa el mouse aquí
    </div>

    <!-- Archivo JS -->
    <script src="../js/dom-manipulation.js"></script>

</body>

</html>
